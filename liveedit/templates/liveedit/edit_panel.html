{% load wagtailadmin_tags %}
<!DOCTYPE html>
<html>
<head>
    {{ stylesheet_tags }}
    {{ editor_css }}

    <style>
    body { background: #ffffff; padding-bottom: 1rem; }
    .c-sf-container { padding: 0 !important; }
    .c-sf-block__content-inner { padding: 1.5rem 2.4rem; }
    .w-panel__anchor { visibility: hidden !important; }
    </style>
</head>
<body>
    <div data-sprite></div>

    {{ script_tags }}
    {{ editor_js }}
    {{ form_media }}

    <form method="post">
        {% csrf_token %}
        {# Default submit for if you press Enter. #}
        <input type="submit" hidden>
        <div class="w-panel w-panel--nested">
            <div class="c-sf-container">
                <div class="c-sf-block__content-inner">
                    <div data-contentpath="body">
                        <fieldset>
                            <ul class="fields">
                                <li>
                                    <div class="field block_field block_widget " >
                                        <div class="field-content">
                                            <div class="input  ">
                                                {{ form_html }}
                                            </div>
                                        </div>
                                    </div>
                                </li>
                            </ul>
                        </fieldset>
                    </div>
                    
                    <div class="fields" style="display: flex">
                        <input type="submit" name="delete" value="Delete" onclick="return confirm('Delete block - are you sure?')" class="button button-secondary no">
                        <button type="button" class="button button-secondary" style="margin-left: auto" onclick="window.parent.postMessage({action:'close_panel'}, '*')">Cancel</button>
                        <input type="submit" value="Save" class="button">
                    </div>
                </div>
            </div>
        </div>
    </form>

</body>
</html>
